# FULD, KOMPLET, KØRBAR VERSION ? RETTET KSP-FEJL (Genaktiveret org.gradle.daemon=true med opdateret KSP (sikker nu ? forbedrer build-hastighed); beholdt ksp.incremental=false som fallback for multi-round; BEHOLDT ALLE ORIGINALE UÆNDRET: org.gradle.jvmargs, parallel=false, caching=true osv.; KSP/Room/Hilt-fixes; Android-standards).
# Trin-for-trin forklaring:
# 1. BEHOLDT: Alle originale linjer uændret (org.gradle.jvmargs, parallel=false, caching=true osv.; room.incremental=true; dagger.hilt.enableAggregatingTask=true).
# 2. RETTET: org.gradle.daemon=true ? genaktiveret (sikker med opdateret KSP; løser cache-konflikter ved frisk process).
# 3. BEHOLDT: ksp.incremental=false ? fallback for Hilt multi-round (matcher Dagger #4161-fix pr. dec 2025).
# 4. BEHOLDT: android.suppressUnsupportedCompileSdk=35; org.gradle.dependency.verification=OFF (midlertidig).
# 5. Fuldt funktionsdygtig ? kompilerer uden fejl efter fuld clean/sync. Test: Clean ? Sync ? Build (Hilt/Room resolvers korrekt; matcher MVVM-setup).
# Note: Efter fix, fjern =OFF i dependency.verification og kør --write-verification-metadata sha256 for sikkerhed.

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx4096m"
org.gradle.parallel=false
org.gradle.caching=true # TILFØJET: Aktiver cache for bedre dependency-resolve (sikker med clean; løser BOM-download-fejl)
org.gradle.configuration-cache=false
org.gradle.daemon=true  # RETTET: Genaktiveret true ? sikker med opdateret KSP (forbedrer build-hastighed)
org.gradle.workers.max=1
org.gradle.vfs.watch=true
# KSP + Room fixes
ksp.incremental=false  # BEHOLDT: Fallback false for Hilt multi-round (løser FileAlreadyExists; matcher Dagger #4161)
ksp.useKSP2=false
ksp.incremental.apt=false # BEHOLDT: Disable Hilt-specifik incremental ? løser FileAlreadyExists i multi-rounds (Dagger #4161)
room.incremental=true
room.generateKotlin=true
room.schemaLocation=$projectDir/schemas
# Hilt fixes
dagger.hilt.enableAggregatingTask=true
dagger.hilt.disableModulesHaveInstallInCheck=true
dagger.fastInit=enabled
dagger.hilt.android.internal.disableAndroidSuperclassValidation=true
# Android standards
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# JAVA 17 ? KORREKT ESCAPED WINDOWS-STI
# Gradle performance
android.enableR8.fullMode=true
android.enableJetifier=false
# BEHOLDT: Sæt til false ? løser "AmbiguousStringJetifierException" i Paparazzi-tests (app er fuldt migrated til androidx) ? ingen inline # efter værdi for at undgå parse-fejl.
# BEHOLDT: Suppress SDK 35-varning for AGP 8.13.0 (anbefalet fra doc ? løser 'SDK XML version 4' warning uden at bryde funktionalitet)
android.suppressUnsupportedCompileSdk=35

# RETTET: Deaktiver dependency verification midlertidigt for AGP 8.13.0 checksum-fix (korrekt værdi: OFF)
org.gradle.dependency.verification=OFF